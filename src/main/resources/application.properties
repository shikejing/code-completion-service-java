# Bind to the local loopback only; the whole pipeline runs in this process.
server.address=127.0.0.1
# Random free port for reproducible local runs/tests.
server.port=0
spring.main.banner-mode=off

# ---- Completion service configuration (see docs/CONFIGURATION.md) ----
completion.type-match-weight=10.0
completion.recency-weight=5.0
completion.recency-window-edits=10
completion.local-variable-base=8.0
completion.parameter-base=7.0
completion.field-base=6.0
completion.method-base=5.0
completion.type-base=4.0
completion.keyword-base=1.0
completion.prefix-char-weight=0.2
completion.proximity-weight=0.5
completion.stale-policy=REJECT
completion.out-of-order-policy=BUFFER
completion.max-buffered-changes=100
completion.max-open-documents=1000
completion.completion-cache-size=256
completion.query-timeout-ms=1000
completion.query-workers=4
# Empty disables durable snapshots; set e.g. ./target/local-data to enable restart recovery.
completion.data-dir=
