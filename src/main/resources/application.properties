# Bind to a random free local port; only the loopback interface is used by
# clients/demo. Override with --server.port=8080 for a fixed port.
server.port=0
server.address=127.0.0.1

# ---------------------------------------------------------------------------
# Completion service configuration (prefix: completion)
# Every item is documented in README.md "Configuration" section.
# ---------------------------------------------------------------------------

# Maximum candidates returned per request (after stable ordering).
completion.max-candidates=128
# Minimum identifier prefix length needed to produce any candidates.
completion.min-prefix-length=0
# Version anomaly policy: STRICT | LENIENT_GAP | ACCEPT_ALL
completion.version-policy=STRICT
# Hard per-request timeout in milliseconds (0 disables the timeout).
completion.request-timeout-millis=2000
# Whether cooperative cancellation is honored.
completion.cancellation-enabled=true

# Ranking weights (higher = ranked first).
completion.weights.local-variable=90
completion.weights.method-parameter=85
completion.weights.member-field=70
completion.weights.method=60
completion.weights.type=40
completion.weights.keyword=10
completion.weights.prefix-exact=30
completion.weights.prefix-case-sensitive=20
completion.weights.prefix-case-insensitive=10
completion.weights.prefix-camel-hump=8
completion.weights.type-match=25
completion.weights.recently-edited=15
completion.weights.recently-edited-window-millis=60000
completion.weights.scope-distance-penalty=4

# Incremental analysis.
completion.incremental.enabled=true
# Affected-region ratio above which a full rebuild is used.
completion.incremental.full-rebuild-region-ratio=0.6

# Cross-request completion cache.
completion.cache.enabled=true
completion.cache.max-entries=512

# Local-file durability.
completion.persistence.enabled=true
completion.persistence.dir=data/completion-service
completion.persistence.fsync=true

# Bounded resource use.
completion.limits.max-documents=256
completion.limits.max-document-chars=1000000
completion.limits.worker-threads=4
